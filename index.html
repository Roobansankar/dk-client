<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f3ea" />
    <!-- Static SEO defaults (homepage values) for crawlers and link-preview
         bots that don't run JavaScript. main.jsx removes every
         [data-seo-default] tag on boot; each route then renders its own
         title / description / canonical / Open Graph via <Seo>. -->
    <title data-seo-default>DK StyleHub — Premium Unisex Salon in Coimbatore</title>
    <meta data-seo-default name="description" content="DK StyleHub is a premium unisex beauty and styling studio in Coimbatore — hair, colour, skin and massage for everyone. Book your appointment online." />
    <meta data-seo-default property="og:site_name" content="DK StyleHub" />
    <meta data-seo-default property="og:locale" content="en_IN" />
    <meta data-seo-default property="og:type" content="website" />
    <meta data-seo-default property="og:title" content="DK StyleHub — Premium Unisex Salon in Coimbatore" />
    <meta data-seo-default property="og:description" content="A premium unisex beauty and styling studio in Coimbatore — hair, colour, skin and massage for everyone." />
    <meta data-seo-default property="og:url" content="https://dkstylehub.com/" />
    <meta data-seo-default property="og:image" content="https://dkstylehub.com/og-image.jpg" />
    <meta data-seo-default property="og:image:width" content="1200" />
    <meta data-seo-default property="og:image:height" content="630" />
    <meta data-seo-default property="og:image:alt" content="The DK StyleHub studio floor — marble flooring, styling stations and warm daylight" />
    <meta data-seo-default name="twitter:card" content="summary_large_image" />
    <meta data-seo-default name="twitter:title" content="DK StyleHub — Premium Unisex Salon in Coimbatore" />
    <meta data-seo-default name="twitter:description" content="A premium unisex beauty and styling studio in Coimbatore — hair, colour, skin and massage for everyone." />
    <meta data-seo-default name="twitter:image" content="https://dkstylehub.com/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: preload + print-media trick so the
         stylesheet never blocks first paint; display=swap avoids invisible
         text while Manrope downloads. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- Homepage hero LCP is handled by the <img> itself in
         src/components/sections/Hero.jsx (loading="eager" +
         fetchpriority="high"). No static preload here: this file serves every
         route including /admin where the hero is never rendered, and Vite
         hashes assets at build time so a hardcoded /src/... preload URL
         never matches the built file — both cases trigger "preloaded but not
         used" warnings plus a wasted fetch. -->
    <script>
      // Resolve the theme before first paint so there is no flash of the wrong
      // palette. Mirrors src/context/ThemeContext.jsx.
      try {
        var pref = localStorage.getItem('dk-theme') || 'system'
        var dark =
          pref === 'dark' ||
          (pref === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <style>
      /* Premium minimal preloader. Uses the theme paper/ink colours already
         resolved above; no gradient, no motion beyond a short opacity fade. */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f7f3ea;
        transition: opacity 260ms cubic-bezier(0.2, 0, 0, 1);
      }
      :root[data-theme='dark'] #preloader {
        background-color: #141311;
      }
      #preloader .pl-mark {
        font-family:
          'Manrope', ui-sans-serif, system-ui, sans-serif;
        font-size: 1.375rem;
        letter-spacing: 0.01em;
        color: #201e1b;
        opacity: 0;
        animation: pl-fade-in 520ms cubic-bezier(0.2, 0, 0, 1) 90ms forwards;
      }
      :root[data-theme='dark'] #preloader .pl-mark {
        color: #f2f0ec;
      }
      #preloader .pl-rule {
        margin-top: 0.75rem;
        height: 1px;
        width: 0;
        background-color: #d0c7b3;
        animation: pl-rule 900ms cubic-bezier(0.2, 0, 0, 1) 200ms forwards;
      }
      :root[data-theme='dark'] #preloader .pl-rule {
        background-color: #423e38;
      }
      @keyframes pl-fade-in {
        to {
          opacity: 0.85;
        }
      }
      @keyframes pl-rule {
        to {
          width: 3.5rem;
        }
      }
      html.is-hydrated #preloader {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader {
          transition: none;
        }
        #preloader .pl-mark,
        #preloader .pl-rule {
          animation: none;
          opacity: 0.85;
        }
        #preloader .pl-rule {
          width: 3.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader" role="status" aria-label="Loading DK StyleHub">
      <div>
        <div class="pl-mark">DK StyleHub</div>
        <div class="pl-rule" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
