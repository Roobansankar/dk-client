<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DK StyleHub - Unisex Salon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- LCP: the homepage hero photo (see src/data/hero.js) is a client-
         rendered <img>, so the browser can't discover it until the JS bundle
         has loaded/executed and React has painted. A static preload hint
         lets the browser start fetching it immediately, in parallel with the
         bundle, instead of waiting for that whole render pipeline first.
         Vite resolves/hashes this path the same way it resolves the JS
         import, so both end up pointing at the exact same built file. -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="/src/assets/images/new-design/opt/studio-wide.jpg"
    />
    <script>
      // Resolve the theme before first paint so there is no flash of the wrong
      // palette. Mirrors src/context/ThemeContext.jsx.
      try {
        var pref = localStorage.getItem('dk-theme') || 'system'
        var dark =
          pref === 'dark' ||
          (pref === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <style>
      /* Premium minimal preloader. Uses the theme paper/ink colours already
         resolved above; no gradient, no motion beyond a short opacity fade. */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f7f3ea;
        transition: opacity 260ms cubic-bezier(0.2, 0, 0, 1);
      }
      :root[data-theme='dark'] #preloader {
        background-color: #141311;
      }
      #preloader .pl-mark {
        font-family:
          'Manrope', ui-sans-serif, system-ui, sans-serif;
        font-size: 1.375rem;
        letter-spacing: 0.01em;
        color: #201e1b;
        opacity: 0;
        animation: pl-fade-in 520ms cubic-bezier(0.2, 0, 0, 1) 90ms forwards;
      }
      :root[data-theme='dark'] #preloader .pl-mark {
        color: #f2f0ec;
      }
      #preloader .pl-rule {
        margin-top: 0.75rem;
        height: 1px;
        width: 0;
        background-color: #d0c7b3;
        animation: pl-rule 900ms cubic-bezier(0.2, 0, 0, 1) 200ms forwards;
      }
      :root[data-theme='dark'] #preloader .pl-rule {
        background-color: #423e38;
      }
      @keyframes pl-fade-in {
        to {
          opacity: 0.85;
        }
      }
      @keyframes pl-rule {
        to {
          width: 3.5rem;
        }
      }
      html.is-hydrated #preloader {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader {
          transition: none;
        }
        #preloader .pl-mark,
        #preloader .pl-rule {
          animation: none;
          opacity: 0.85;
        }
        #preloader .pl-rule {
          width: 3.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader" role="status" aria-label="Loading DK StyleHub">
      <div>
        <div class="pl-mark">DK StyleHub</div>
        <div class="pl-rule" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
